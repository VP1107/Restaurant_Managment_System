name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiosqlite "fastapi>=0.135.2" "fastapi-users[sqlalchemy]" psycopg2-binary python-dotenv uvicorn
          pip install pytest pytest-asyncio httpx

      - name: Run pytest
        env:
          SECRET_KEY: ci-test-secret-key
        run: pytest -v
